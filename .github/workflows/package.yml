name: Publish API package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/validate.py
  publish:
    needs: validate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_feed.py
          gh release create "$GITHUB_REF_NAME" hongputao-api.json _site/feed.json --verify-tag --title "红葡萄 API ${GITHUB_REF_NAME#v}" --generate-notes
  publish-edgeone-feed:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: api-edgeone
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: edgeone-feed
          path: edgeone-feed
      - run: python3 scripts/build_feed.py
      - name: Publish the released feed to the EdgeOne production branch
        shell: bash
        run: |
          current=$(jq -er .version edgeone-feed/feed.json)
          released=$(jq -er .version _site/feed.json)
          newest=$(printf '%s\n' "$current" "$released" | sort -V | tail -n 1)
          if [[ "$current" == "$newest" ]]; then
            echo "EdgeOne production already targets $current or newer."
            exit 0
          fi
          cp _site/feed.json _site/hongputao-api.json edgeone-feed/
          cd edgeone-feed
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -am "Publish API feed $GITHUB_REF_NAME"
          git push origin HEAD:refs/heads/edgeone-feed
  deploy-feed:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: api-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v5
      - run: python3 scripts/build_feed.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
