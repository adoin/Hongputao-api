name: Publish API package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/validate.py
  publish:
    needs: validate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build_feed.py
          gh release create "$GITHUB_REF_NAME" hongputao-api.json _site/feed.json --verify-tag --title "红葡萄 API ${GITHUB_REF_NAME#v}" --generate-notes
  deploy-edgeone:
    needs: publish
    if: vars.EDGEONE_PROJECT != ''
    runs-on: ubuntu-latest
    concurrency:
      group: api-edgeone
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python3 scripts/build_feed.py
      - name: Deploy static update feed to EdgeOne
        env:
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT }}
          EDGEONE_SITE: ${{ vars.EDGEONE_SITE }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$EDGEONE_API_TOKEN"
          case "$EDGEONE_SITE" in china|global) ;; *) echo "EDGEONE_SITE must be china or global"; exit 1;; esac
          npx --yes --package=edgeone@1.7.6 edgeone makers deploy ./_site -n "$EDGEONE_PROJECT" -t "$EDGEONE_API_TOKEN" --site "$EDGEONE_SITE" -e production
  deploy-feed:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: api-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v5
      - run: python3 scripts/build_feed.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
